[toolchain]
anchor_version = "1.2.0"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
outcome_yield_pool = "2h3hJSZVR6DgSGXmmf4wdBqo8z16kzMyVJ5gJWT1mskZ"

[programs.mainnet]
outcome_yield_pool = "2h3hJSZVR6DgSGXmmf4wdBqo8z16kzMyVJ5gJWT1mskZ"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Anchor 1.2's own build step targets SBPF v3 with platform-tools v1.57, which the LiteSVM suite cannot load.
# Rebuild with the pinned toolchain (SBPF v0, platform-tools v1.52) so the tests run the binaries they are meant to.
test = "cargo build-sbf && cargo test -p outcome_yield_pool"
